# Mirror of examples/claude_desktop_config.json as a Hermes-style YAML config,
# exercising the built-in (PyYAML-free) YAML reader. Run:
#   mcp-fleet-doctor --config examples/hermes_config.yaml
mcp_servers:
  example-ok:
    command: python3
    args:
      - examples/ok_server.py
  example-missing-dep:
    command: python3
    args:
      - examples/missing_dep_server.py
  example-hanging:
    command: python3
    args:
      - examples/hanging_server.py
